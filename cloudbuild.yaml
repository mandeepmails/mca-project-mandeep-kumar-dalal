options:
  logging: CLOUD_LOGGING_ONLY

# provided "roles/logging.logWriter" 
# "artifactregistry.repositories.uploadArtifacts" 
# "roles/run.admin" 
# "roles/iam.serviceAccountUser"
#  to project service account

steps:

- name: python:3.11-slim
  entrypoint: bash
  args:
    - -c
    - |
      pip install flask==3.0.0
      python -m unittest discover -s tests

- name: 'gcr.io/cloud-builders/docker'
  args:
    - build
    - -t
    - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-mca-project/app:$SHORT_SHA
    - .

- name: 'gcr.io/cloud-builders/docker'
  args:
    - push
    - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-mca-project/app:$SHORT_SHA

- name: 'gcr.io/cloud-builders/gcloud'
  args:
    - run
    - deploy
    - cloud-cicd-demo-mca-project
    - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-mca-project/app:$SHORT_SHA
    - --region=us-central1
    - --platform=managed
    - --allow-unauthenticated
    - --set-env-vars=APP_VERSION=$SHORT_SHA